name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: taskflow-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify tested commit is still main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TESTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/git/ref/heads/main',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'TaskFlow-deploy'})
          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response)['object']['sha']
          eligible = current == os.environ['TESTED_COMMIT']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('eligible=' + str(eligible).lower() + '\n')
          print('Deploy current tested main' if eligible else 'Skip: a newer main commit exists')
          PY
      - name: Prepare SSH keys
        if: steps.revision.outputs.eligible == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/vps_key ~/.ssh/deploy_key

      - name: Prepare known hosts
        if: steps.revision.outputs.eligible == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          printf '%s\n' \
            '[127.0.0.1]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAERmK2T97K3zW4FdTIn9tfSIZjsNDPp8Gr4wWCBkxYf' \
            >> ~/.ssh/known_hosts

      - name: Deploy through VPS tunnel
        if: steps.revision.outputs.eligible == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ProxyCommand="ssh -i ~/.ssh/vps_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -W %h:%p $VPS_USER@$VPS_HOST" \
            -p 2222 \
            deploy@127.0.0.1 \
            "sudo -n /usr/local/sbin/taskflow-deploy $DEPLOY_COMMIT"
