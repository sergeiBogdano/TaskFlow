name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.VPS_SSH_KEY }}
            ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy through VPS tunnel
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -A \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "ssh -A -p 2222 deploy@127.0.0.1 'sudo -n /usr/local/sbin/taskflow-deploy'"