name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  postgres-user-deletion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: deletion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: taskflow-seo
    env:
      TEST_DELETE_DATABASE_URL: postgresql+asyncpg://postgres:test-only@localhost:5432/deletion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: taskflow-seo/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p data logs
      - run: python -m pytest tests/test_user_deletion.py tests/test_workspace_purge.py tests/test_root_password_cli.py -q

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: taskflow-seo

    env:
      TESTING: "1"
      TASKFLOW_LEGACY_UI: "0"
      DATABASE_URL: sqlite+aiosqlite:///./data/test.db
      WEB_APP_SECRET: test-secret-for-ci
      CRYPTO_SECRET: test-crypto-secret
      LOG_LEVEL: WARNING
      OVERDUE_CHECK_INTERVAL_SECONDS: "3600"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: taskflow-seo/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create test directories
        run: |
          mkdir -p data
          mkdir -p logs

      - name: Run tests
        run: pytest --cov=app --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - run: npm ci
      - run: npm run build
