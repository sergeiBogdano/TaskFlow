name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: taskflow-seo

    env:
      TESTING: "1"
      TASKFLOW_LEGACY_UI: "1"
      DATABASE_URL: sqlite+aiosqlite:///./data/test.db
      WEB_APP_SECRET: test-secret-for-ci
      CRYPTO_SECRET: test-crypto-secret
      LOG_LEVEL: WARNING
      OVERDUE_CHECK_INTERVAL_SECONDS: "3600"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: taskflow-seo/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term
