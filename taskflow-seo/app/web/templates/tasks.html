{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-list-task me-2"></i>Задачи</h4>
  <div class="btn-group btn-group-sm">
    <a href="/api/tasks/export/csv" class="btn btn-outline-secondary" title="Скачать CSV"><i class="bi bi-filetype-csv"></i></a>
    <a href="/api/tasks/export/pdf" class="btn btn-outline-secondary" title="Открыть PDF для печати" target="_blank"><i class="bi bi-filetype-pdf"></i></a>
  </div>
  <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#taskModal">
    <i class="bi bi-plus-lg me-1"></i>Новая задача
  </button>
</div>

<div class="row mb-3">
  <div class="col">
    <div class="d-flex gap-2 flex-wrap align-items-center" id="filterBar">
      <select id="filterStatus" class="form-select form-select-sm" style="width: auto;">
        <option value="">Все статусы</option>
        <option value="todo">К выполнению</option>
        <option value="in_progress">В работе</option>
        <option value="done">Выполнено</option>
        <option value="overdue">Просрочено</option>
      </select>
      <input type="text" id="filterSearch" class="form-control form-control-sm" placeholder="Поиск..." style="width: 160px;">
      <input type="date" id="filterDateFrom" class="form-control form-control-sm" style="width: auto;" title="Дата с">
      <input type="date" id="filterDateTo" class="form-control form-control-sm" style="width: auto;" title="Дата по">
      <select id="filterType" class="form-select form-select-sm" style="width: auto;">
        <option value="">Все типы</option>
        <option value="article">Статья</option>
        <option value="seo">SEO</option>
        <option value="dev">Разработка</option>
        <option value="custom">Обычная</option>
      </select>
      <select id="filterPriority" class="form-select form-select-sm" style="width: auto;">
        <option value="">Все приоритеты</option>
        <option value="low">Низкий</option>
        <option value="medium">Средний</option>
        <option value="high">Высокий</option>
      </select>
      <select id="filterTag" class="form-select form-select-sm" style="width: auto;">
        <option value="">Все теги</option>
      </select>
      <select id="filterModule" class="form-select form-select-sm" style="width: auto;">
        <option value="">Все модули</option>
      </select>
      <select id="filterSort" class="form-select form-select-sm" style="width: auto;">
        <option value="created">Новые</option>
        <option value="deadline">По сроку</option>
        <option value="priority">По важности</option>
        <option value="status">По статусу</option>
      </select>
      <select id="filterOrder" class="form-select form-select-sm" style="width: auto;">
        <option value="desc">Сначала новые</option>
        <option value="asc">Сначала старые</option>
      </select>
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-bookmark"></i></button>
        <ul class="dropdown-menu dropdown-menu-end" id="savedViewsMenu">
          <li><a class="dropdown-item small" href="#" onclick="saveCurrentFilter(); return false;"><i class="bi bi-plus-circle me-1"></i>Сохранить фильтр</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item small text-secondary" disabled>Нет сохранённых</a></li>
        </ul>
      </div>
      <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div id="tasksContainer">
      <div class="p-4 text-center text-secondary">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>Загрузка...
      </div>
    </div>
  </div>
</div>

<div id="batchBar" style="display:none;" class="mt-2">
  <div class="d-flex align-items-center gap-2 p-2 bg-dark rounded">
    <span class="text-white small" id="batchCount">0 выбрано</span>
    <select class="form-select form-select-sm" style="width:auto;" id="batchAction">
      <option value="">— Действие —</option>
      <option value="status">Изменить статус</option>
      <option value="priority">Изменить приоритет</option>
      <option value="delete">Удалить</option>
    </select>
    <select class="form-select form-select-sm" style="width:auto;display:none;" id="batchValue">
      <option value="todo">К выполнению</option>
      <option value="in_progress">В работе</option>
      <option value="done">Выполнено</option>
      <option value="overdue">Просрочено</option>
    </select>
    <select class="form-select form-select-sm" style="width:auto;display:none;" id="batchPriority">
      <option value="low">Низкий</option>
      <option value="medium">Средний</option>
      <option value="high">Высокий</option>
    </select>
    <button class="btn btn-sm btn-primary" onclick="executeBatch()">Применить</button>
    <button class="btn btn-sm btn-outline-secondary" onclick="clearSelection()">Отмена</button>
  </div>
</div>

<nav class="mt-3" id="paginationNav"></nav>

{# Modal: просмотр задачи #}
<div class="modal fade" id="taskDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="detailTitle">Задача</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer" id="detailFooter"></div>
    </div>
  </div>
</div>

{# Modal: создание #}
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <form method="POST" action="/tasks/create" id="createTaskForm">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Новая задача</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-8 mb-3">
              <label class="form-label">Название</label>
              <input type="text" name="title" class="form-control" required autofocus>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Тип</label>
              <select name="task_type" class="form-select" id="createTaskType" onchange="loadTemplate(this.value, 'create')">
                <option value="custom">Обычная</option>
                <option value="article">Статья</option>
                <option value="seo">SEO</option>
                <option value="dev">Разработка</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Важность</label>
              <select name="priority" class="form-select">
                <option value="low">Низкий</option>
                <option value="medium" selected>Средний</option>
                <option value="high">Высокий</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Клиент</label>
              <select name="client_id" class="form-select" id="createClientSelect">
                <option value="">—</option>
                {% for c in all_clients %}
                <option value="{{ c.id }}" data-end="{{ c.end }}">{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Срок (крайний)</label>
              <input type="datetime-local" name="deadline" class="form-control" id="createDeadline">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Дата выполнения (для календаря)</label>
              <input type="datetime-local" name="completion_date" class="form-control">
            </div>
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Повторение</label>
              <select name="recurring_interval" class="form-select">
                <option value="">Нет</option>
                <option value="daily">Ежедневно</option>
                <option value="weekly">Еженедельно</option>
                <option value="monthly">Ежемесячно</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Количество повторений</label>
              <input type="number" name="recurring_count" class="form-control" placeholder="∞" min="1">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Чек-лист</label>
            <div id="createChecklist"></div>
            <button type="button" class="btn btn-sm btn-outline-secondary mt-1" onclick="addChecklistItem('createChecklist')"><i class="bi bi-plus"></i> Добавить пункт</button>
            <input type="hidden" name="checklist_raw" id="createChecklistRaw">
          </div>
          <div class="mb-3">
            <label class="form-label">Заметка</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <textarea name="comment" class="form-control" rows="4"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary">Создать</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
const TEMPLATES = {{ checklist_templates_json|safe }};

let allTasks = [];
let filteredTasks = [];
let currentPage = 1;
let filterClientId = null;
let allTags = [];
let allModules = [];
const PER_PAGE = 20;

function loadTags() {
  fetch('/api/tags').then(r => r.json()).then(tags => {
    allTags = tags;
    const sel = document.getElementById('filterTag');
    if (sel) {
      sel.innerHTML = '<option value="">Все теги</option>' + tags.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    }
  });
}

function loadModules() {
  fetch('/api/modules').then(r => r.json()).then(modules => {
    allModules = modules;
    const sel = document.getElementById('filterModule');
    if (sel) {
      sel.innerHTML = '<option value="">Все модули</option>' + modules.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
    }
  });
}

function loadSavedViews() {
  const saved = JSON.parse(localStorage.getItem('savedViews') || '[]');
  const menu = document.getElementById('savedViewsMenu');
  if (!menu) return;
  let html = '<li><a class="dropdown-item small" href="#" onclick="saveCurrentFilter(); return false;"><i class="bi bi-plus-circle me-1"></i>Сохранить фильтр</a></li>';
  if (saved.length) {
    html += '<li><hr class="dropdown-divider"></li>';
    saved.forEach((sv, i) => {
      html += `<li><a class="dropdown-item small" href="#" onclick="applySavedView(${i}); return false;">${escHtml(sv.name)}</a></li>`;
    });
  } else {
    html += '<li><hr class="dropdown-divider"></li><li><a class="dropdown-item small text-secondary" disabled>Нет сохранённых</a></li>';
  }
  menu.innerHTML = html;
}

function saveCurrentFilter() {
  const name = prompt('Название фильтра:');
  if (!name) return;
  const filters = {
    status: document.getElementById('filterStatus').value,
    search: document.getElementById('filterSearch').value,
    type: document.getElementById('filterType').value,
    priority: document.getElementById('filterPriority').value,
    tag: document.getElementById('filterTag').value,
    module: document.getElementById('filterModule').value,
    sort: document.getElementById('filterSort').value,
    order: document.getElementById('filterOrder').value,
  };
  const saved = JSON.parse(localStorage.getItem('savedViews') || '[]');
  saved.push({ name, filters });
  localStorage.setItem('savedViews', JSON.stringify(saved));
  loadSavedViews();
  showToast('Фильтр сохранён');
}

function applySavedView(idx) {
  const saved = JSON.parse(localStorage.getItem('savedViews') || '[]');
  if (!saved[idx]) return;
  const f = saved[idx].filters;
  document.getElementById('filterStatus').value = f.status || '';
  document.getElementById('filterSearch').value = f.search || '';
  document.getElementById('filterType').value = f.type || '';
  document.getElementById('filterPriority').value = f.priority || '';
  document.getElementById('filterTag').value = f.tag || '';
  document.getElementById('filterModule').value = f.module || '';
  document.getElementById('filterSort').value = f.sort || 'created';
  document.getElementById('filterOrder').value = f.order || 'desc';
  applyFilters();
  showToast('Применён: ' + saved[idx].name);
}

function loadTasks() {
  const params = new URLSearchParams(window.location.search);
  filterClientId = params.get('client_id') ? parseInt(params.get('client_id')) : null;

  fetch('/api/tasks/all')
    .then(r => r.json())
    .then(tasks => {
      allTasks = tasks;
      applyFilters();
    })
    .catch(err => {
      document.getElementById('tasksContainer').innerHTML =
        '<div class="p-4 text-center text-danger">Ошибка загрузки задач</div>';
    });
}

function applyFilters() {
  const status = document.getElementById('filterStatus').value;
  const search = document.getElementById('filterSearch').value.toLowerCase();
  const dateFrom = document.getElementById('filterDateFrom').value;
  const dateTo = document.getElementById('filterDateTo').value;
  const taskType = document.getElementById('filterType').value;
  const priority = document.getElementById('filterPriority').value;
  const sort = document.getElementById('filterSort').value;
  const order = document.getElementById('filterOrder').value;
  const tagId = document.getElementById('filterTag').value;
  const moduleId = document.getElementById('filterModule').value;

  filteredTasks = allTasks.filter(t => {
    if (status && t.status !== status) return false;
    if (taskType && t.task_type !== taskType) return false;
    if (priority && t.priority !== priority) return false;
    if (search && !t.title.toLowerCase().includes(search) && !(t.client && t.client.toLowerCase().includes(search))) return false;
    if (filterClientId && t.client_id !== filterClientId) return false;
    if (dateFrom && t.deadline && new Date(t.deadline) < new Date(dateFrom)) return false;
    if (dateTo && t.deadline) {
      const end = new Date(dateTo);
      end.setHours(23, 59, 59);
      if (new Date(t.deadline) > end) return false;
    }
    if (tagId && (!t.tags || !t.tags.some(tg => String(tg.id) === tagId || String(tg) === tagId))) return false;
    if (moduleId && t.module_id !== parseInt(moduleId)) return false;
    return true;
  });

  // Sort
  const sortFns = {
    'deadline': t => t.deadline || '9999-12-31',
    'priority': t => ({'high': 0, 'medium': 1, 'low': 2}[t.priority] || 1),
    'status': t => ({'overdue': 0, 'todo': 1, 'in_progress': 2, 'done': 3}[t.status] || 4),
    'order': t => t.sort_order || 0,
  };
  const sf = sortFns[sort] || (t => t.id);
  filteredTasks.sort((a, b) => {
    const va = sf(a), vb = sf(b);
    if (va < vb) return order === 'asc' ? -1 : 1;
    if (va > vb) return order === 'asc' ? 1 : -1;
    return 0;
  });

  currentPage = 1;
  renderPage();
}

function renderPage() {
  const total = filteredTasks.length;
  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PER_PAGE;
  const pageTasks = filteredTasks.slice(start, start + PER_PAGE);

  const container = document.getElementById('tasksContainer');

  if (!pageTasks.length) {
    container.innerHTML = '<div class="p-4 text-center text-secondary"><i class="bi bi-inbox" style="font-size: 2rem;"></i><p class="mt-2">Нет задач</p></div>';
    document.getElementById('paginationNav').innerHTML = '';
    document.getElementById('batchBar').style.display = 'none';
    return;
  }

  let html = '<div class="table-responsive"><table class="table table-hover mb-0" id="taskTable"><thead class="table-dark"><tr>'
    + '<th style="width:36px;"><input class="form-check-input" type="checkbox" id="selectAll" onchange="toggleAll(this)"></th>'
    + '<th>#</th><th>Задача</th><th>Клиент</th><th>Срок</th><th>Важность</th><th>Статус</th><th></th>'
    + '</tr></thead><tbody>';

  for (const t of pageTasks) {
    const dl = t.deadline ? new Date(t.deadline) : null;
    const now = new Date();
    const daysLeft = dl ? Math.ceil((dl - now) / (1000 * 60 * 60 * 24)) : 99;
    const overdue = t.status === 'overdue';
    const done = t.status === 'done';

    const rec = t.recurring_interval;
    const recLabel = rec ? (rec === 'daily' ? 'Ежедн' : rec === 'weekly' ? 'Еженед' : 'Ежемес') : '';
    html += '<tr class="' + (overdue ? 'table-danger' : done ? 'table-success' : '') + '">'
      + '<td><input class="form-check-input task-check" type="checkbox" value="' + t.id + '"></td>'
      + '<td>' + t.id + '</td>'
      + '<td><a href="#" class="text-decoration-none" onclick="showTaskDetail(' + t.id + '); return false;"><strong>' + escHtml(t.title) + '</strong></a>'
      + (t.notes ? '<i class="bi bi-pin-angle-fill text-secondary ms-1" title="Есть заметка"></i>' : '')
      + (t.checklist && t.checklist.length ? '<i class="bi bi-list-check text-secondary ms-1" title="Чек-лист"></i>' : '')
      + (rec ? ' <span class="badge bg-info text-dark" title="Повтор: ' + recLabel + ' осталось: ' + (t.recurring_remaining ?? '∞') + '"><i class="bi bi-arrow-repeat"></i> ' + recLabel + '</span>' : '')
      + '</td>'
      + '<td>' + (t.client ? escHtml(t.client) : '<span class="text-secondary">—</span>') + (t.tags && t.tags.length ? ' <span class="d-inline-flex gap-1 ms-1">' + t.tags.map(tg => '<span class="tag-badge" style="background:' + (tg.color||'#3b82f6') + '22;color:' + (tg.color||'#3b82f6') + '">' + escHtml(tg.name||tg) + '</span>').join('') + '</span>' : '') + '</td>'
      + '<td>' + (dl ? '<span class="' + (daysLeft < 0 && !done ? 'text-danger fw-bold' : daysLeft <= 2 && !done ? 'text-warning fw-bold' : '') + '">' + formatDate(dl) + '</span>' : '<span class="text-secondary">—</span>') + '</td>'
      + '<td>' + getPrioBadge(t.priority) + '</td>'
      + '<td>' + getStatusBadge(t.status) + '</td>'
      + '<td><div class="d-flex gap-1">'
      + (t.status !== 'done' ? '<form method="POST" action="/tasks/' + t.id + '/done" class="d-inline" onsubmit="return confirm(\'Выполнить задачу #' + t.id + '?\')"><button class="btn btn-sm btn-outline-success" title="Выполнено"><i class="bi bi-check-lg"></i></button></form>' : '')
      + (rec && t.status === 'done' ? '<button class="btn btn-sm btn-outline-info" onclick="generateNext(' + t.id + ')" title="Создать следующую"><i class="bi bi-skip-forward"></i></button>' : '')
      + '<button class="btn btn-sm btn-outline-primary" onclick="editTask(' + t.id + ')" title="Редактировать"><i class="bi bi-pencil"></i></button>'
      + '<form method="POST" action="/tasks/' + t.id + '/delete" class="d-inline" onsubmit="return confirm(\'Удалить задачу #' + t.id + '?\')"><button class="btn btn-sm btn-outline-danger" title="Удалить"><i class="bi bi-trash"></i></button></form>'
      + '</div></td>'
      + '</tr>';
  }

  html += '</tbody></table></div>';
  container.innerHTML = html;

  // Pagination
  let pagHtml = '';
  if (totalPages > 1) {
    pagHtml = '<ul class="pagination pagination-sm justify-content-center">';
    for (let p = 1; p <= totalPages; p++) {
      pagHtml += '<li class="page-item ' + (p === currentPage ? 'active' : '') + '"><a class="page-link" href="#" onclick="goPage(' + p + '); return false;">' + p + '</a></li>';
    }
    pagHtml += '</ul>';
  }
  document.getElementById('paginationNav').innerHTML = pagHtml;
  document.getElementById('batchBar').style.display = 'none';
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(d) {
  const pad = n => String(n).padStart(2, '0');
  return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function getPrioBadge(p) {
  const m = {'high': ['danger', 'Высокий'], 'medium': ['warning text-dark', 'Средний'], 'low': ['secondary', 'Низкий']};
  const v = m[p] || m['medium'];
  return '<span class="badge bg-' + v[0] + '">' + v[1] + '</span>';
}

function getStatusBadge(s) {
  const m = {'todo': ['secondary', 'К выполнению'], 'in_progress': ['primary', 'В работе'], 'done': ['success', 'Выполнено'], 'overdue': ['danger', 'Просрочено']};
  const v = m[s] || m['todo'];
  return '<span class="badge bg-' + v[0] + '">' + v[1] + '</span>';
}

function goPage(p) {
  currentPage = p;
  renderPage();
  document.getElementById('tasksContainer').scrollIntoView({behavior: 'smooth', block: 'start'});
}

function resetFilters() {
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterSearch').value = '';
  document.getElementById('filterDateFrom').value = '';
  document.getElementById('filterDateTo').value = '';
  document.getElementById('filterType').value = '';
  document.getElementById('filterPriority').value = '';
  applyFilters();
}

document.querySelectorAll('#filterBar select, #filterBar input').forEach(el => {
  el.addEventListener('change', applyFilters);
  el.addEventListener('input', el.tagName === 'INPUT' ? applyFilters : null);
});

function onClientChange(select) {
  const idx = select.selectedIndex;
  const opt = select.options[idx];
  const deadline = opt ? opt.dataset.end : '';
  if (deadline) {
    document.getElementById('createDeadline').value = deadline;
  }
}

document.getElementById('createClientSelect')?.addEventListener('change', function() { onClientChange(this); });

document.getElementById('createTaskForm')?.addEventListener('submit', function() {
  const items = [];
  document.querySelectorAll('#createChecklist input[type="text"]').forEach(inp => {
    if (inp.value.trim()) items.push({text: inp.value.trim(), done: false});
  });
  document.getElementById('createChecklistRaw').value = JSON.stringify(items);
});

function showTaskDetail(id) {
  openDetailModal(id);
}

// Batch
document.getElementById('batchAction')?.addEventListener('change', function() {
  document.getElementById('batchValue').style.display = this.value === 'status' ? '' : 'none';
  document.getElementById('batchPriority').style.display = this.value === 'priority' ? '' : 'none';
});

function toggleAll(master) {
  document.querySelectorAll('.task-check').forEach(cb => cb.checked = master.checked);
  updateBatchBar();
}

function updateBatchBar() {
  const checked = document.querySelectorAll('.task-check:checked');
  const bar = document.getElementById('batchBar');
  bar.style.display = checked.length > 0 ? '' : 'none';
  document.getElementById('batchCount').textContent = checked.length + ' выбрано';
}

document.addEventListener('change', function(e) {
  if (e.target.classList.contains('task-check')) updateBatchBar();
});

function getSelectedIds() {
  return Array.from(document.querySelectorAll('.task-check:checked')).map(cb => parseInt(cb.value));
}

function clearSelection() {
  document.querySelectorAll('.task-check').forEach(cb => cb.checked = false);
  document.getElementById('selectAll').checked = false;
  updateBatchBar();
}

function executeBatch() {
  const ids = getSelectedIds();
  if (!ids.length) return;
  const action = document.getElementById('batchAction').value;
  if (!action) { alert('Выберите действие'); return; }
  if (action === 'delete' && !confirm('Удалить ' + ids.length + ' задач?')) return;

  let value = null;
  if (action === 'status') value = document.getElementById('batchValue').value;
  if (action === 'priority') value = document.getElementById('batchPriority').value;

  fetch('/api/tasks/batch', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ids: ids, action: action, value: value})
  }).then(r => r.json()).then(data => {
    if (data.ok) {
      showToast('Изменено ' + data.affected + ' задач');
      loadTasks();
    } else {
      alert('Ошибка: ' + (data.error || 'неизвестная'));
    }
  }).catch(() => alert('Ошибка сети'));
}

function editTask(id) {
  const t = allTasks.find(x => x.id === id);
  if (!t) return;
  const dl = t.deadline ? t.deadline.slice(0, 16) : '';
  const html = '<form id="editForm" onsubmit="saveEdit(' + id + '); return false;">'
    + '<div class="row">'
    + '<div class="col-md-8 mb-3"><label class="form-label">Название</label><input type="text" id="editTitle" class="form-control" value="' + escHtml(t.title) + '" required></div>'
    + '<div class="col-md-4 mb-3"><label class="form-label">Тип</label><select id="editType" class="form-select">'
    + '<option value="custom"' + (t.task_type === 'custom' ? ' selected' : '') + '>Обычная</option>'
    + '<option value="article"' + (t.task_type === 'article' ? ' selected' : '') + '>Статья</option>'
    + '<option value="seo"' + (t.task_type === 'seo' ? ' selected' : '') + '>SEO</option>'
    + '<option value="dev"' + (t.task_type === 'dev' ? ' selected' : '') + '>Разработка</option>'
    + '</select></div>'
    + '</div>'
    + '<div class="row">'
    + '<div class="col-md-4 mb-3"><label class="form-label">Важность</label><select id="editPriority" class="form-select">'
    + '<option value="low"' + (t.priority === 'low' ? ' selected' : '') + '>Низкий</option>'
    + '<option value="medium"' + (t.priority === 'medium' ? ' selected' : '') + '>Средний</option>'
    + '<option value="high"' + (t.priority === 'high' ? ' selected' : '') + '>Высокий</option>'
    + '</select></div>'
    + '<div class="col-md-4 mb-3"><label class="form-label">Статус</label><select id="editStatus" class="form-select">'
    + '<option value="todo"' + (t.status === 'todo' ? ' selected' : '') + '>К выполнению</option>'
    + '<option value="in_progress"' + (t.status === 'in_progress' ? ' selected' : '') + '>В работе</option>'
    + '<option value="done"' + (t.status === 'done' ? ' selected' : '') + '>Выполнено</option>'
    + '<option value="overdue"' + (t.status === 'overdue' ? ' selected' : '') + '>Просрочено</option>'
    + '</select></div>'
    + '<div class="col-md-4 mb-3"><label class="form-label">Срок</label><input type="datetime-local" id="editDeadline" class="form-control" value="' + dl + '"></div>'
    + '</div>'
    + '<div class="row mt-2">'
    + '<div class="col-md-4 mb-3"><label class="form-label">Повторение</label><select id="editRecurring" class="form-select">'
    + '<option value="">Нет</option>'
    + '<option value="daily"' + (t.recurring_interval === 'daily' ? ' selected' : '') + '>Ежедневно</option>'
    + '<option value="weekly"' + (t.recurring_interval === 'weekly' ? ' selected' : '') + '>Еженедельно</option>'
    + '<option value="monthly"' + (t.recurring_interval === 'monthly' ? ' selected' : '') + '>Ежемесячно</option>'
    + '</select></div>'
    + '<div class="col-md-4 mb-3"><label class="form-label">Кол-во повторений</label><input type="number" id="editRecurringCount" class="form-control" value="' + (t.recurring_count || '') + '" min="1" placeholder="∞"></div></div>'
    + '<div class="mb-3"><label class="form-label">Заметка</label><textarea id="editNotes" class="form-control" rows="2">' + escHtml(t.notes) + '</textarea></div>'
    + '<div class="mb-3"><label class="form-label">Комментарий</label><textarea id="editComment" class="form-control" rows="4">' + escHtml(t.comment) + '</textarea></div>'
    + '</form>';

  const modal = new bootstrap.Modal(document.getElementById('taskDetailModal'));
  document.getElementById('detailTitle').textContent = '#' + t.id + ' ' + t.title;
  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('detailFooter').innerHTML = ''
    + '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>'
    + '<button type="submit" class="btn btn-primary" form="editForm">Сохранить</button>';

function saveEdit(id) {
  const data = {
    title: document.getElementById('editTitle').value,
    task_type: document.getElementById('editType').value,
    priority: document.getElementById('editPriority').value,
    status: document.getElementById('editStatus').value,
    deadline: document.getElementById('editDeadline').value || null,
    notes: document.getElementById('editNotes').value,
    comment: document.getElementById('editComment').value,
    recurring_interval: document.getElementById('editRecurring').value || null,
    recurring_count: document.getElementById('editRecurringCount').value || null,
  };
  fetch('/api/tasks/' + id, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }).then(r => {
    if (r.ok) {
      bootstrap.Modal.getInstance(document.getElementById('taskDetailModal')).hide();
      showToast('Сохранено');
      loadTasks();
    } else {
      alert('Ошибка сохранения');
    }
  }).catch(() => alert('Ошибка сети'));
}

function generateNext(id) {
  fetch('/api/tasks/' + id + '/generate-next', {method: 'POST'})
    .then(r => r.json()).then(data => {
      if (data.ok) {
        showToast('Создана следующая задача #' + data.new_id);
        loadTasks();
      } else {
        alert('Ошибка: ' + (data.error || 'неизвестная'));
      }
    }).catch(() => alert('Ошибка сети'));
}

document.addEventListener('DOMContentLoaded', function() {
  loadTasks();
  loadTags();
  loadModules();
  loadSavedViews();
});
</script>
