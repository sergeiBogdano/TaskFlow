{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-bar-chart me-2"></i>Отчёты и аналитика</h4>
  <div class="d-flex gap-2 align-items-center">
    <a href="/api/reports/export/csv" class="btn btn-outline-secondary btn-sm" title="Скачать CSV отчёт"><i class="bi bi-filetype-csv"></i></a>
    <select id="periodSelect" class="form-select form-select-sm" style="width:auto;" onchange="reloadCharts()">
      <option value="3" {% if months == 3 %}selected{% endif %}>3 месяца</option>
      <option value="6" {% if months == 6 %}selected{% endif %}>6 месяцев</option>
      <option value="12" {% if months == 12 %}selected{% endif %}>12 месяцев</option>
      <option value="24" {% if months == 24 %}selected{% endif %}>2 года</option>
    </select>
  </div>
</div>

<div class="row g-3 mb-4">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header"><i class="bi bi-graph-up me-1"></i>Динамика задач по месяцам</div>
      <div class="card-body"><canvas id="monthlyChart" height="200"></canvas></div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card">
      <div class="card-header"><i class="bi bi-pie-chart me-1"></i>Статусы задач</div>
      <div class="card-body"><canvas id="statusChart" height="200"></canvas></div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card">
      <div class="card-header"><i class="bi bi-funnel me-1"></i>Воронка клиентов</div>
      <div class="card-body"><canvas id="funnelChart" height="200"></canvas></div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header"><i class="bi bi-bar-chart-steps me-1"></i>Топ-10 клиентов по задачам</div>
  <div class="card-body"><canvas id="clientChart" height="200"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const COLORS = {
  created: 'rgba(13, 202, 240, 0.8)',
  done: 'rgba(25, 135, 84, 0.8)',
  overdue: 'rgba(220, 53, 69, 0.8)',
  todo: 'rgba(108, 117, 125, 0.8)',
  in_progress: 'rgba(13, 110, 253, 0.8)',
};

let monthlyChart, statusChart, funnelChart, clientChart;

function reloadCharts() {
  const months = document.getElementById('periodSelect').value;
  window.location.href = '/reports?period=' + months;
}

function initCharts(data) {
  if (monthlyChart) monthlyChart.destroy();
  if (statusChart) statusChart.destroy();
  if (funnelChart) funnelChart.destroy();
  if (clientChart) clientChart.destroy();

  monthlyChart = new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
      labels: data.labels,
      datasets: [
        { label: 'Создано', data: data.created, backgroundColor: COLORS.created, borderRadius: 3 },
        { label: 'Выполнено', data: data.done, backgroundColor: COLORS.done, borderRadius: 3 },
        { label: 'Просрочено', data: data.overdue, backgroundColor: COLORS.overdue, borderRadius: 3 },
      ]
    },
    options: { responsive: true, plugins: { legend: { labels: { boxWidth: 12 } } },
      scales: { x: { ticks: { maxTicksLimit: 12 } }, y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });

  statusChart = new Chart(document.getElementById('statusChart'), {
    type: 'doughnut',
    data: {
      labels: ['К выполнению', 'В работе', 'Выполнено', 'Просрочено'],
      datasets: [{
        data: [data.status_dist.todo, data.status_dist.in_progress, data.status_dist.done, data.status_dist.overdue],
        backgroundColor: [COLORS.todo, COLORS.in_progress, COLORS.done, COLORS.overdue],
      }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } }
  });

  funnelChart = new Chart(document.getElementById('funnelChart'), {
    type: 'doughnut',
    data: {
      labels: ['Активны', 'Пауза', 'Закрыты'],
      datasets: [{
        data: [data.client_funnel.active, data.client_funnel.paused, data.client_funnel.closed],
        backgroundColor: [COLORS.done, 'rgba(255, 193, 7, 0.8)', COLORS.overdue],
      }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } }
  });

  clientChart = new Chart(document.getElementById('clientChart'), {
    type: 'bar',
    data: {
      labels: data.client_tasks.map(c => c.name),
      datasets: [
        { label: 'Активные', data: data.client_tasks.map(c => c.active), backgroundColor: 'rgba(13, 110, 253, 0.7)', borderRadius: 3 },
        { label: 'Выполнено', data: data.client_tasks.map(c => c.done), backgroundColor: COLORS.done, borderRadius: 3 },
      ]
    },
    options: { responsive: true, indexAxis: 'y', plugins: { legend: { labels: { boxWidth: 12 } } },
      scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

document.addEventListener('DOMContentLoaded', function() {
  const months = {{ months }};
  fetch('/api/reports/data?months=' + months)
    .then(r => r.json())
    .then(data => initCharts(data));
});
</script>
{% endblock %}
