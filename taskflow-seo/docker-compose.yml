services:
  web:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Moscow}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_APP_SECRET: ${WEB_APP_SECRET:?WEB_APP_SECRET is required}
      OLLAMA_URL: ${OLLAMA_URL:-http://172.20.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}

    volumes:
      - taskflow_logs:/app/logs

    networks:
      taskflow-prod:
      taskflow-router:
        aliases:
          - ${WEB_ALIAS:?WEB_ALIAS is required}

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped

    networks:
      taskflow-prod:
      taskflow-router:
        aliases:
          - ${FRONTEND_ALIAS:?FRONTEND_ALIAS is required}

    expose:
      - "80"

    depends_on:
      web:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  taskflow_logs:


networks:
  taskflow-prod:
    external: true

  taskflow-router:
    external: true
