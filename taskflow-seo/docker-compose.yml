version: '3.8'

services:
  bot:
    build: .
    container_name: taskflow-seo-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=sqlite+aiosqlite:///./data/taskflow.db
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-Europe/Moscow}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./templates:/app/templates
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
